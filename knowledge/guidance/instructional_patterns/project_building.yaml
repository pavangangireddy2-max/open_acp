instructional_pattern: project_building
preferred_learning_unit_type: video_session_unit
preferred_presentation_surface: slide_backed_session
common_teaching_mode_sequence:
  - project_context
  - concept_explain
  - architecture_reasoning
  - guided_build
  - verification_checkpoint
  - integration_demo
  - reflection_summary
required_flow:
  - project outcome preview
  - specification framing
  - architecture reasoning
  - milestone build sequence
  - verification checkpoints
  - integration demo
  - reflection and next steps
deck_constraints:
  architecture_diagram_frequency: 3
  max_code_lines_per_slide: 12
  checkpoint_slide_per_milestone: true
  include_troubleshooting_notes: true
  show_expected_output_after_build_steps: true
