notes:
  - URLs marked ingestion=rss are slice-1 targets (RSS-backed).
  - URLs marked ingestion=scrape need bespoke HTML extraction; deferred to slice 3.
  - URLs marked ingestion=x require X API or login flows; deferred to slice 4.
  - URLs marked ingestion=deferred map to D11b (community chatter) and are out of scope for v1.
  - x_signal_types reflects the curated tag from the user-supplied URL list and is used by the digest reducer for dimension weighting.
  - Some declared RSS endpoints (Microsoft Research, Qwen, Hugging Face, Lex Fridman, LLM Watch, Import AI, Latent Space, Addy Osmani, PromptHub) have not been validated against the live web yet; the rss_ingestor will surface fetch errors when run.
