version: 1
domain: genai
shared_signal_manifest: ../shared/shared_intelligence_sources.yaml
domain_pedagogy_profile: project_build_along
domain_pedagogy_rationale: >
  The GenAI stack curriculum is milestone- and project-centered overall.
  Concept sessions should support build milestones, architecture choices, and
  deployable outcomes rather than acting as isolated theory modules.

raw_style_corpus:
  exports:
    - knowledge/raw/brand/sample_genai_project.pdf
    - knowledge/raw/brand/genai_s2.pdf
    - knowledge/raw/brand/genai_s3.pdf
    - knowledge/raw/brand/genai_s4.pdf
    - knowledge/raw/brand/genai_s5.pdf

external_slide_sources:
  - https://docs.google.com/presentation/d/1yRHXA-w45eyn8P1t8pVvDD-C9o1M7fCn--nOE0eq6ak/edit
  - https://docs.google.com/presentation/d/1CXGaJUwv7RkGx0dwi8YzNnyr71MdCiRvyqKXC3B30s8/edit
  - https://docs.google.com/presentation/d/1miLne283zjhq_UBs372x11EJ41ja1hMqcD6Ww7GRDo4/edit
  - https://docs.google.com/presentation/d/10qr298PFvuBuDEFORbRPkVoR0ywZQhH7ko_OTQR9Or0/edit
  - https://docs.google.com/presentation/d/1bIpAmU6KCPv2YKu6qwhgIw9eVLH9Qth6cm596gshFWY/edit

competitor_sources:
  - knowledge/sources/shared/competitors/competitor_courses.md
curriculum_sources:
  - knowledge/sources/domains/genai/curriculum_refs/genai_120hr_curriculum.md

notes:
  - GenAI sessions should clearly separate landscape framing, model reasoning, system architecture, and applied build checkpoints.
  - Treat project-based progression as the domain-level default even when individual sections temporarily switch into concept explanation or architecture reasoning.
