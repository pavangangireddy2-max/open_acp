version: 1
domain: cpp
source_family_manifests:
  - ../source_families/dimension_1_job_outcomes.yaml
  - ../source_families/dimension_9_market_and_community.yaml

pedagogy:
  default:
    pedagogy_profile: worked_example_scaffold
    pedagogy_rationale: >
      C++ should usually teach through worked examples, careful misconception
      handling, and explicit comparisons that surface memory and syntax pitfalls.
  content_types:
    project_building:
      pedagogy_profile: project_build_along
      pedagogy_rationale: >
        C++ project work should still move through build checkpoints and practical
        implementation milestones once the worked-example foundation is in place.

raw_style_corpus:
