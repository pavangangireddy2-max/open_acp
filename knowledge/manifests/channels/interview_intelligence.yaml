channel_id: interview_intelligence
label: Interview Intelligence
channel_category: interview_intel
unit_of_data: one_question_one_entry
owning_dimensions: [1]
keep_raw_analysis_external: true
preferred_ingest_mode: aggregated_export

canonical_source_families:
  - source_family_id: role_opportunity_summary
    description: Aggregated summary of target role clusters, opportunity share, and recency signals for the stack.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: skill_opportunity_summary
    description: Aggregated summary of canonical skill demand, frequency, and role association after raw-to-canonical mapping.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: course_opportunity_summary
    description: Aggregated view of which courses or course variants appear most often in interview-intelligence analysis.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: topic_relevance_summary
    description: Aggregated topic-level opportunity and importance summary for curriculum relevance decisions.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: topic_sequencing_summary
    description: Aggregated topic dependency and ordering pressure summary derived from interview-intelligence analytics.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: question_type_distribution
    description: Aggregated question-type mix across the analyzed interview-intelligence window.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: question_depth_summary
    description: Aggregated difficulty and depth-band summary for interview and skill-assessment expectations.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: package_band_summary
    description: Aggregated packaging-band implications such as C1/C2/C3 breadth and L1/L2/L3 depth pressure.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export
  - source_family_id: recency_retirement_summary
    description: Aggregated recency, relevance, and retirement signals for topics, skills, or question patterns.
    expected_location: knowledge/catalog/interview_intelligence/
    preferred_granularity: aggregated_export

canonical_vocabularies:
  - vocabulary_id: canonical_skill_taxonomy
    description: Approved canonical skill list used for raw-to-canonical mapping before curriculum analytics.
    owner: curriculum_team
  - vocabulary_id: interview_question_type_vocabulary
    description: Canonical question type set such as MCQ, coding, project, theory, and logical reasoning.
    owner: curriculum_team
  - vocabulary_id: package_band_vocabulary
    description: Breadth bands such as C1, C2, and C3 for packaging implications.
    owner: curriculum_team
  - vocabulary_id: depth_band_vocabulary
    description: Difficulty depth bands such as L1, L2, and L3.
    owner: skill_assessment_team

runtime_digests:
  - digest_id: skill_outcomes_signal_digest
    purpose: Aggregate role, skill, sequencing, packaging, and interview-pattern signals across the canonical interview-intelligence source families for Dimension 1.
  - digest_id: assessment_pattern_digest
    purpose: Distill assessment-format, question-type, and depth implications from the same canonical interview-intelligence source families.

knowledge_targets:
  - target_id: role_profile
    target_type: runtime_entity
    update_mode: create
  - target_id: skill_entities
    target_type: runtime_entity
    update_mode: enrich
  - target_id: stack_skill_profiles
    target_type: stack_profile
    update_mode: enrich
  - target_id: market_and_community_digest
    target_type: cycle_artifact
    update_mode: derive
  - target_id: product_summaries
    target_type: product_summary
    update_mode: enrich

loop_b_influence:
  - brief
  - curriculum_structure
  - course_design
  - module_design
  - topic_design
  - practice_design
  - learning_assessment_design
  - skill_assessment_alignment

backprop_targets:
  - loop_id: loop_b
    stage_id: compose_product_specific_curriculum_container
    rationale: New role and skill-cluster demand can create or remove course-level curriculum requirements.
  - loop_id: loop_b
    stage_id: design_topics
    rationale: Topic relevance, sequencing pressure, and topic retirement signals should reshape topic design.
  - loop_id: loop_b
    stage_id: design_practice
    rationale: Question-type mix and depth signals should shape practice design.
  - loop_id: loop_b
    stage_id: design_learning_assessments
    rationale: Interview patterns should pressure-test learning-assessment formats and difficulty.
  - loop_id: loop_b
    stage_id: align_learning_with_skill_assessments
    rationale: Placement-linked question types and depth bands should align with skill assessment expectations.

notes:
  - Raw CRM workflows, interview recordings, and multi-team tagging steps remain outside Open ACP.
  - Open ACP should prefer canonical aggregated exports rather than raw question streams when monthly volume is high.
  - The denominator rule and recency window used in external analysis should be preserved in the exported snapshot metadata.
  - This channel covers only the interview-intelligence contribution to Dimension 1, not the full Dimension 1 source model.
  - skill_outcomes_signal_digest should be a runtime aggregate over the canonical source families above, not an independently invented signal layer.
