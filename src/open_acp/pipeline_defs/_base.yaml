version: "1.0"
description: "Base pipeline configuration — inherited by all pipelines"

defaults:
  eval_threshold: 3.5
  max_iterations: 5
  model_tier: strong

  review:
    self_review_skill: meta/reviewer
    checkpoint_skill: meta/checkpoint_protocol
    max_review_rounds: 2

  gate:
    type: G3
    blocking: true
    sample_rate: 1.0

required_dimensions:
  - accuracy
  - pedagogy
  - engagement
  - brand
  - citation_provenance
