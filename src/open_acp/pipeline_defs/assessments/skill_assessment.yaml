inherits: _assessment_base
pipeline_id: skill_assessment
content_type: skill_assessment
display_name: "Skill Assessment"
description: "Placement-linked skill assessment with configurable scope, cadence, and difficulty"

frequency: configurable
duration_minutes: 45
question_count: { min: 15, max: 20 }
bloom_target: [Apply, Analyze]

stages:
  - id: scope_definition
    skill: pipelines/skill_assessment/01_scope_definition
    tools: [claude_generate]
    artifact_schema: outline.schema.json
    model_tier: strong
    review_focus:
      - "Scope covers the configured assessment window"
      - "Integration across relevant topics is tested, not just recall"

  - id: question_generation
    skill: pipelines/skill_assessment/02_question_generation
    tools: [claude_generate]
    artifact_schema: assessment.schema.json
    model_tier: strong
    review_focus:
      - "Questions target Apply and Analyze Bloom levels"
      - "Analyze-level questions require breaking down problems"
      - "Scenarios are realistic and domain-relevant"

  - id: rubric_design
    skill: pipelines/skill_assessment/03_rubric_design
    tools: [claude_generate]
    artifact_schema: assessment.schema.json
    model_tier: strong
    review_focus:
      - "Analyze-level rubrics assess reasoning quality, not just answers"
      - "Partial credit rewards correct methodology even with wrong final answer"

  - id: difficulty_balancing
    skill: pipelines/skill_assessment/04_difficulty_balancing
    tools: [claude_generate]
    artifact_schema: assessment.schema.json
    model_tier: cheap
    review_focus:
      - "Roughly 50% Apply, 50% Analyze distribution"
      - "No questions below Apply level"

  - id: review
    skill: pipelines/skill_assessment/05_review
    tools: [claude_generate]
    artifact_schema: assessment.schema.json
    model_tier: cheap
    checkpoint_required: true
    human_approval_default: true

style: default
