# Quick baseline for coding_question_craft via OpenRouter.
# Run: set -a; source .env; set +a; prime eval run @configs/eval/cqc-openrouter.toml
model = "openai/gpt-4.1-mini"
num_tasks = 6
num_rollouts = 1
max_concurrent = 6
max_turns = 1

[taskset]
id = "coding_question_craft"

[client]
type = "eval"
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[sampling]
max_tokens = 2000
temperature = 0.7
