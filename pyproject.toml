[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open_acp"
version = "0.1.0"
description = "Agentic Content Production system — 4-loop LangGraph + DSPy content pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.49.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "dspy-ai>=2.6.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.2.0",
    "tenacity>=8.4.0",
    "python-pptx>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
oacp = "open_acp.cli.main:app"
echo = "open_acp.echo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/open_acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
