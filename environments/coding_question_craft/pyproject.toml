[project]
name = "coding-question-craft"
description = "Author programming problems; reward = the reference solution passing its own generated tests"
tags = ["code-generation", "problem-authoring", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["coding_question_craft.py", "pyproject.toml", "data/*.json"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
